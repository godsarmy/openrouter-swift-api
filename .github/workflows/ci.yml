name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build
        run: swift build --configuration debug

      - name: Test
        run: swift test

  macos:
    name: macOS build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build
        run: swift build --configuration debug

      - name: Test
        run: swift test

  format:
    name: Strict format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.0"

      - name: Lint format
        run: swift format lint --strict --parallel --recursive Package.swift Sources Tests
