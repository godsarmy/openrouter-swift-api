name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r scripts/requirements-docs.txt

      - name: Test documentation checker
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate OKF bundle and local links
        run: python scripts/check_docs.py

  linux:
    name: Linux build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build
        run: swift build --configuration debug

      - name: Test
        run: swift test

  macos:
    name: macOS build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build
        run: swift build --configuration debug

      - name: Test
        run: swift test

  format:
    name: Strict format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.0"

      - name: Lint format
        run: swift format lint --strict --parallel --recursive Package.swift Sources Tests
